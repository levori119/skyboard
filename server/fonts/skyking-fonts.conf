<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  SKY-KING - החלפת גופני Windows בגופנים שמותקנים בקונטיינר (Dockerfile).

  למה: מסמך Word/PowerPoint שנכתב ב-David / Miriam / Tahoma מומר ל-PDF ע"י
  LibreOffice בשרת. בלי גופן מתאים הוא נופל לגופן חלופי עם רוחבי אותיות אחרים,
  והעברית יוצאת מפורקת - אותיות מרווחות ושורות שבורות (2026-10-17).
  לגופני Office הלטיניים (Arial, Times, Calibri, Cambria) יש תחליפים זהים ברוחב
  (Liberation, Carlito, Caladea), ו-fontconfig ממפה אותם בעצמו. כאן - העבריים.
-->
<fontconfig>
  <alias binding="same"><family>David</family><prefer><family>David CLM</family></prefer></alias>
  <alias binding="same"><family>Miriam</family><prefer><family>Miriam CLM</family></prefer></alias>
  <alias binding="same"><family>Miriam Fixed</family><prefer><family>Miriam Mono CLM</family></prefer></alias>
  <alias binding="same"><family>FrankRuehl</family><prefer><family>Frank Ruehl CLM</family></prefer></alias>
  <alias binding="same"><family>Frank Ruehl</family><prefer><family>Frank Ruehl CLM</family></prefer></alias>
  <alias binding="same"><family>Narkisim</family><prefer><family>Nachlieli CLM</family></prefer></alias>
  <alias binding="same"><family>Aharoni</family><prefer><family>Aharoni CLM</family></prefer></alias>
  <alias binding="same"><family>Guttman Yad</family><prefer><family>Ellinia CLM</family></prefer></alias>
  <alias binding="same"><family>Gisha</family><prefer><family>Noto Sans Hebrew</family></prefer></alias>
  <alias binding="same"><family>Levenim MT</family><prefer><family>Noto Sans Hebrew</family></prefer></alias>
  <alias binding="same"><family>Tahoma</family><prefer><family>DejaVu Sans</family><family>Noto Sans Hebrew</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Noto Sans</family><family>Noto Sans Hebrew</family></prefer></alias>
  <alias binding="same"><family>Arial Hebrew</family><prefer><family>Liberation Sans</family><family>Noto Sans Hebrew</family></prefer></alias>
  <!-- גופן שאין לו עברית (למשל Calibri→Carlito) - האותיות העבריות ייקחו מכאן -->
  <alias><family>sans-serif</family><prefer><family>Noto Sans Hebrew</family></prefer></alias>
  <alias><family>serif</family><prefer><family>David CLM</family></prefer></alias>
</fontconfig>
