<!--
  אייקון האפליקציה של עמדת SKY KING (Electron).
  נגזר מלוגו מסך הכניסה ב-src/App.tsx (ראדאר + מטוס במסלול), בגרסה סטטית
  ומעובה: קווי הרשת והמעגל הפנימי הוסרו ועובי הקווים הוגדל, כי אייקון נקרא
  גם ב-16x16 בשורת המשימות - שם קו של 0.5 יחידות פשוט נעלם.
  מקור האמת לקובץ build/icon.png (שנבנה ממנו) - ראה scripts/build-icon.mjs.
-->
<svg width="1024" height="1024" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="radar" cx="36" cy="36" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="36" y1="36" x2="10" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- רקע -->
  <rect width="72" height="72" rx="16" fill="#0f172a"/>
  <circle cx="36" cy="36" r="34" fill="url(#radar)"/>

  <!-- טבעות ראדאר -->
  <circle cx="36" cy="36" r="26" stroke="#2563eb" stroke-width="1.6" fill="none" opacity="0.85"/>
  <circle cx="36" cy="36" r="16" stroke="#2563eb" stroke-width="1.2" fill="none" opacity="0.5"/>

  <!-- אלומת סריקה: גזרה דוהה + קו מוביל בהיר -->
  <path d="M 36,36 L 25.0,59.6 A 26,26 0 0 1 11.6,44.9 Z" fill="#3b82f6" opacity="0.16"/>
  <line x1="36" y1="36" x2="11.6" y2="44.9" stroke="url(#sweep)" stroke-width="2.4" stroke-linecap="round"/>

  <!-- כוונת מרכז -->
  <line x1="32.5" y1="36" x2="39.5" y2="36" stroke="#3b82f6" stroke-width="1.4" opacity="0.9"/>
  <line x1="36" y1="32.5" x2="36" y2="39.5" stroke="#3b82f6" stroke-width="1.4" opacity="0.9"/>
  <circle cx="36" cy="36" r="2" fill="#60a5fa"/>

  <!-- מגע ראדאר -->
  <circle cx="22" cy="53" r="2.6" fill="#34d399"/>

  <!-- מטוס על המסלול (פינה ימנית עליונה, נושא כלפי מעלה-ימינה) -->
  <g transform="translate(49.5,22.5) rotate(-45) scale(1.05)">
    <polygon points="10,0  5,1.3  -9,2  -9,-2  5,-1.3" fill="#ffffff"/>
    <polygon points="3,1.3  -7,11  -9,2" fill="#93c5fd"/>
    <polygon points="3,-1.3  -7,-11  -9,-2" fill="#93c5fd"/>
    <polygon points="-8,2  -11,5  -9.5,2" fill="#bfdbfe"/>
    <polygon points="-8,-2  -11,-5  -9.5,-2" fill="#bfdbfe"/>
    <circle cx="6.5" cy="0" r="1.3" fill="#dbeafe" opacity="0.85"/>
  </g>
</svg>
